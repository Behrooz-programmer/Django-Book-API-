<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>{% block title %}My Website{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% if messages %}
    {% for message in messages %}
        <p class="message">{{ message }}</p>
    {% endfor %}
{% endif %}


    {% block content %}
    {% endblock %}

</body>
</html>
