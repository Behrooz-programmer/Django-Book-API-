{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h1>Register</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <label>Confirm Password:</label>
    <input type="password" name="password2">

    <br><br>

    <button type="submit">Register</button>
</form>

{% endblock %}
